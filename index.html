function bacaIdentitas(p){
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const kv = g(p + '-kelas');
  return {
    nama: g(p + '-nama').trim(), nis: g(p + '-nis').trim(),
    tempatLahir: g(p + '-tempatlahir').trim(), tglLahir: g(p + '-tgllahir'),
    ayah: g(p + '-ayah').trim(), ibu: g(p + '-ibu').trim(),
    anakKe: g(p + '-anakke').trim(), nik: g(p + '-nik').trim(),
    alamat: g(p + '-alamat').trim(), email: g(p + '-email').trim(), hp: g(p + '-hp').trim(),
    gender: g(p + '-gender'), kelas: kv,
    kelasLain: kv === '__lain__' ? g(p + '-kelas-lain').trim() : ''
  };
}
function kvDariSiswa(st){
  return { nama: st.name || '', nis: st.nis || '', tempatLahir: st.tempatLahir || '', tglLahir: st.tglLahir || '',
    ayah: st.ayah || '', ibu: st.ibu || '', anakKe: st.anakKe || '', nik: st.nik || '', alamat: st.alamat || '',
    email: st.email || '', hp: st.hp || '', gender: st.gender || 'Laki-laki', kelas: st.classId, kelasLain: '' };
}
function kandidatDari(v, cls){
  return { name: v.nama, nis: v.nis, tempatLahir: v.tempatLahir, tglLahir: v.tglLahir, ayah: v.ayah, ibu: v.ibu,
    anakKe: v.anakKe, nik: v.nik, alamat: v.alamat, email: v.email, hp: v.hp, gender: v.gender,
    classId: cls ? cls.id : '__kelas-baru__' };
}
function terapkanIdentitas(st, v, cls){
  st.name = v.nama; st.nis = v.nis; st.tempatLahir = v.tempatLahir; st.tglLahir = v.tglLahir;
  st.ayah = v.ayah; st.ibu = v.ibu; st.anakKe = v.anakKe; st.nik = v.nik; st.alamat = v.alamat;
  st.email = v.email; st.hp = v.hp; st.gender = v.gender; st.classId = cls.id;
}
/* Cari kelas dari pilihan formulir; kelas baru dibuat SETELAH cek duplikat lolos. */
function cariKelasForm(v){
  if(v.kelas === '__lain__'){
    if(!v.kelasLain) return { galat: 'Isi nama kelas terlebih dahulu.' };
    return { cls: findClassByName(v.kelasLain) };
  }
  const cls = getClass(v.kelas);
  if(!cls) return { galat: 'Pilih kelas terlebih dahulu.' };
  return { cls: cls };
}

/* ---------- Pendaftaran siswa (di dalam portal, setelah masuk) ---------- */
function renderDaftarSiswa(el, acc){
  const kv = daftarKeep || { nama:'', nis:'', tempatLahir:'', tglLahir:'', ayah:'', ibu:'', anakKe:'', nik:'', alamat:'', email:'', hp:'', gender:'Laki-laki', kelas:'', kelasLain:'' };
  if(!dokDaftar) dokDaftar = dokKosong();
  el.innerHTML =
    akunBarHtml(acc) +
    '<div class="card"><h2>Daftarkan Data Siswa</h2>' +
      '<p class="muted" style="margin-top:0">Satu akun hanya dapat mendaftarkan <b>satu siswa</b>. Setelah terdaftar, formulir ini terkunci — bila ada kesalahan ketik, perbaiki lewat menu <b>Edit Identitas</b>. Isi identitas selengkapnya; pendaftaran hanya ditolak bila <b>seluruh</b> identitasnya persis sama dengan siswa yang sudah terdaftar.</p>' +
      akunBannerHtml() +
      '<form onsubmit="return submitDaftar(event)">' +
        identFieldsHtml('d', kv) +
        dokFieldsHtml('daftar', dokDaftar) +
        '<button class="btn block" type="submit" style="margin-top:14px">Daftarkan Siswa &amp; Buat QR</button>' +
      '</form></div>';
}
function submitDaftar(ev){
  ev.preventDefault();
  const acc = currentAccount();
  if(!acc || acc.role !== 'siswa') return false;
  if(studentOfAccount(acc.id)){
    akunMsg = { type:'err', text:'Akun Anda sudah memiliki satu siswa terdaftar. Satu akun hanya boleh mendaftarkan satu siswa.' };
    render(); return false;
  }
  const v = bacaIdentitas('d');
  daftarKeep = v;
  if(!v.nama) return false;
  const salahD = validasiIdentitas(v);
  if(salahD){
    akunMsg = { type:'err', text:'❌ Data belum valid: ' + salahD };
    render(); return false;
  }
  const hasil = cariKelasForm(v);
  if(hasil.galat){ alert(hasil.galat); return false; }
  let cls = hasil.cls;
  const dupMsg = cekDuplikat(kandidatDari(v, cls), null);
  if(dupMsg){
    akunMsg = { type:'err', text:'❌ ' + dupMsg };
    render(); return false;
  }
  let kelasBaru = null;
  if(!cls){
    kelasBaru = { id: newClassId(), name: v.kelasLain, ownerTeacherId: null };
    cls = kelasBaru;
  }
  const st = normStudent({ id: newStudentId(), ownerAccountId: acc.id });
  terapkanIdentitas(st, v, cls);
  st.dokumen = Object.assign(dokKosong(), dokDaftar || {});
  if(kelasBaru) db.classes.push(kelasBaru);
  db.students.push(st);
  if(!saveDBStrict()){
    // Kuota penuh: batalkan penambahan agar data tidak setengah tersimpan.
    db.students = db.students.filter(s => s.id !== st.id);
    if(kelasBaru) db.classes = db.classes.filter(c => c.id !== kelasBaru.id);
    akunMsg = { type:'err', text:'❌ ' + PESAN_KUOTA };
    render(); return false;
  }
  daftarKeep = null;
  dokDaftar = null;
  setSession(acc);
  akunMsg = { type:'ok', text:'✅ Pendaftaran berhasil. QR pribadi siswa sudah siap di bawah.' };
  render();
  return false;
}

/* ---------- Portal siswa (akun masuk + siswa terdaftar) ---------- */
function renderPortalSiswa(el, acc, me){
  const recs = db.attendance
    .filter(a => a.studentId === me.id)
    .slice()
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  let hist;
  if(recs.length === 0){
    hist = '<p class="muted">Belum ada catatan kehadiran yang tersimpan di perangkat ini.</p>';
  } else {
    hist = recs.map(r =>
      '<div class="hist-row"><span>' + fmtTgl(r.date) +
      (r.time ? ' <span class="muted small">• ' + esc(r.time) + '</span>' : '') +
      (r.note ? '<div class="small muted">' + esc(r.note) + '</div>' : '') +
      '</span><span class="status-dot ' + esc(r.status) + '">' + esc(r.status) + '</span></div>'
    ).join('');
  }

  let editHtml = '';
  if(editMine){
    const kv = ubahKeep || kvDariSiswa(me);
    if(!dokUbah) dokUbah = Object.assign(dokKosong(), me.dokumen || {});
    editHtml =
      '<div class="card"><h3>✏️ Edit Identitas</h3>' +
        '<p class="muted" style="margin-top:0">Perbaiki nama dan data siswa Anda bila ada kesalahan ketik. Ubahan hanya ditolak bila <b>seluruh</b> identitas hasil ubahan persis sama dengan siswa lain; bila ada satu saja yang berbeda, ubahan tersimpan seperti biasa.</p>' +
        '<form onsubmit="return submitUbahSaya(event)">' +
          identFieldsHtml('u', kv) +
          dokFieldsHtml('ubah', dokUbah) +
          '<div class="row" style="margin-top:14px"><button class="btn" type="submit">💾 Simpan Perubahan</button>' +
          '<button class="btn secondary" type="button" onclick="batalEditIdentitas()">Batal</button></div>' +
        '</form></div>';
  }

  el.innerHTML =
    akunBarHtml(acc) +
    akunBannerHtml() +
    editHtml +
    '<div class="card qr-big"><h2>QR Saya</h2>' +
      '<p class="muted" style="margin-top:0">Tunjukkan QR ini kepada guru untuk dicatat kehadirannya. QR ini hanya tampil untuk akun pemilik pendaftaran ini.</p>' +
      '<canvas id="my-qr"></canvas>' +
      '<div style="font-weight:800;font-size:18px;margin-top:10px">' + esc(me.name) + '</div>' +
      '<div class="muted">NISN ' + esc(me.nis || '-') + ' • ' + esc(className(me.classId)) + '</div>' +
      '<div class="muted small">ID: ' + esc(me.id) + '</div>' +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn" onclick="unduhQR(\'' + me.id + '\')">⬇ Unduh QR</button>' +
        '<button class="btn secondary" onclick="mulaiEditIdentitas()">✏️ Edit Identitas</button>' +
      '</div>' +
      '<button class="btn secondary block" style="margin-top:10px" onclick="openDetailSiswa(\'' + me.id + '\')">👁 Lihat Detail Identitas &amp; Dokumen Saya</button>' +
    '</div>' +
    '<div class="card"><h3>Kehadiran Saya</h3>' + hist +
      '<p class="small muted" style="margin-bottom:0">Catatan di atas hanya yang tersimpan di perangkat ini. Kehadiran yang dicatat atau dipindai di perangkat guru tersimpan di perangkat guru, jadi mungkin tidak tampil di sini.</p>' +
    '</div>';
  drawQR(document.getElementById('my-qr'), qrPayload(me), 9);
}
function mulaiEditIdentitas(){
  editMine = true;
  ubahKeep = null;
  dokUbah = null;
  akunMsg = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function batalEditIdentitas(){
  editMine = false;
  ubahKeep = null;
  dokUbah = null;
  render();
}
function submitUbahSaya(ev){
  ev.preventDefault();
  const acc = currentAccount();
  const me = acc ? studentOfAccount(acc.id) : null;
  if(!me) return false;
  const v = bacaIdentitas('u');
  ubahKeep = v;
  if(!v.nama) return false;
  const salahU = validasiIdentitas(v);
  if(salahU){
    akunMsg = { type:'err', text:'❌ Data belum valid: ' + salahU };
    render(); return false;
  }
  const hasil = cariKelasForm(v);
  if(hasil.galat){ alert(hasil.galat); return false; }
  let cls = hasil.cls;
  const dupMsg = cekDuplikat(kandidatDari(v, cls), me.id);
  if(dupMsg){
    akunMsg = { type:'err', text:'❌ ' + dupMsg };
    render(); return false;
  }
  let kelasBaru = null;
  if(!cls){
    kelasBaru = { id: newClassId(), name: v.kelasLain, ownerTeacherId: null };
    cls = kelasBaru;
  }
  const cadangan = JSON.stringify(me);
  if(kelasBaru) db.classes.push(kelasBaru);
  terapkanIdentitas(me, v, cls);
  if(dokUbah) me.dokumen = Object.assign(dokKosong(), dokUbah);
  if(!saveDBStrict()){
    // Kuota penuh: kembalikan data lama agar tidak setengah tersimpan.
    const pulih = JSON.parse(cadangan);
    Object.keys(me).forEach(k => delete me[k]);
    Object.assign(me, pulih);
    if(kelasBaru) db.classes = db.classes.filter(c => c.id !== kelasBaru.id);
    akunMsg = { type:'err', text:'❌ ' + PESAN_KUOTA };
    render(); return false;
  }
  editMine = false;
  ubahKeep = null;
  dokUbah = null;
  akunMsg = { type:'ok', text:'✅ Identitas berhasil diperbarui.' };
  render();
  return false;
}

/* ============================== ADMIN ==============================
   Satu-satunya akun bawaan aplikasi. Kredensial admin tertanam di kode
   halaman ini — gerbang akses ringan untuk versi mandiri yang halamannya
   publik, BUKAN keamanan yang kuat — dan tidak pernah ditampilkan di UI.
   Admin memegang seluruh data perangkat: melihat & mengubah semua akun,
   kelas, siswa (identitas lengkap + dokumen + QR), absensi, dan rekap;
   membuka wilayah akun guru/siswa mana pun tanpa masuk sebagai mereka;
   tidak terikat aturan satu-pendaftaran maupun pemisahan data antar-guru.
   Admin TIDAK membuatkan akun guru/siswa untuk siapa pun — semua akun
   selain Admin dibuat sendiri oleh penggunanya lewat formulir pendaftaran.
   (Menambah catatan siswa ke daftar kelas oleh guru adalah data kelas,
   bukan akun masuk.) */
const ADMIN_USER = 'Namexs';
const ADMIN_PASS = 'Rijal140703';
const ADMIN_KEY = 'absensiSiswa.admin';
let adminLogin = false;
try{ adminLogin = localStorage.getItem(ADMIN_KEY) === '1'; }catch(e){}
let adminMsg = null;
let adminView = 'ringkasan';   // ringkasan | guru | siswa | kelas | rekap
let adminGuruId = null;
let adminEditId = null;
let adminUbahKeep = null;
let adminRekapMonth = todayStr().slice(0, 7);

function renderAdminMode(){
  const el = document.getElementById('admin-view');
  if(!adminLogin){ renderLoginAdmin(el); return; }
  renderPanelAdmin(el);
}
function renderLoginAdmin(el){
  el.innerHTML =
    '<div class="card"><h2>🛡 Masuk — Admin</h2>' +
      '<p class="muted" style="margin-top:0">Area khusus pemilik aplikasi. Masuk dengan akun admin bawaan untuk melihat dan mengelola seluruh data di perangkat ini.</p>' +
      (adminMsg ? '<div class="banner show ' + adminMsg.type + '">' + esc(adminMsg.text) + '</div>' : '') +
      '<form onsubmit="return submitLoginAdmin(event)">' +
        '<div class="field"><label for="adm-user">Nama Pengguna Admin</label><input id="adm-user" class="inp" required autocomplete="username" placeholder="Nama pengguna"></div>' +
        '<div class="field"><label for="adm-pass">Kata Sandi Admin</label><input id="adm-pass" type="password" class="inp" required autocomplete="current-password" placeholder="Kata sandi"></div>' +
        '<button class="btn block" type="submit">Masuk sebagai Admin</button>' +
      '</form>' +
      '<p class="small muted" style="margin-bottom:0">Akun guru dan akun siswa tidak dibuatkan oleh admin — masing-masing mendaftar sendiri lewat mode Guru / mode Siswa.</p></div>';
}
function submitLoginAdmin(ev){
  ev.preventDefault();
  const u = document.getElementById('adm-user').value;
  const p = document.getElementById('adm-pass').value;
  if(u === ADMIN_USER && p === ADMIN_PASS){
    adminLogin = true;
    try{ localStorage.setItem(ADMIN_KEY, '1'); }catch(e){}
    adminMsg = null;
    adminView = 'ringkasan';
    adminEditId = null;
  } else {
    adminMsg = { type:'err', text:'Nama pengguna atau kata sandi admin salah. Periksa kembali dan coba lagi.' };
  }
  render();
  return false;
}
function keluarAdmin(){
  adminLogin = false;
  try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}
  adminMsg = null;
  adminGuruId = null;
  adminEditId = null;
  adminUbahKeep = null;
  dokAdmin = null;
  render();
}
function adminNav(v){
  adminView = v;
  if(v !== 'siswa'){ adminEditId = null; adminUbahKeep = null; dokAdmin = null; }
  adminMsg = null;
  render();
}
function adminBukaGuru(id){ adminGuruId = id; adminView = 'guru'; render(); }

function renderPanelAdmin(el){
  const guruAccs = db.accounts.filter(a => a.role === 'guru');
  const siswaAccs = db.accounts.filter(a => a.role === 'siswa');
  const navBtn = (v, label) =>
    '<button class="' + (adminView === v ? 'btn' : 'btn secondary') + ' small-btn" onclick="adminNav(\'' + v + '\')">' + label + '</button>';
  let body = '';
  if(adminView === 'guru') body = adminGuruHtml(guruAccs);
  else if(adminView === 'siswa') body = adminSiswaHtml();
  else if(adminView === 'kelas') body = adminKelasHtml();
  else if(adminView === 'rekap') body = adminRekapHtml();
  else body = adminRingkasanHtml(guruAccs, siswaAccs);
  el.innerHTML =
    '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<span class="small">🛡 Masuk sebagai <b>Admin</b><span class="badge-admin">AKSES PENUH</span></span>' +
      '<button class="btn secondary small-btn" onclick="keluarAdmin()">Keluar Admin</button></div>' +
    '<div class="tabs">' + navBtn('ringkasan', '📋 Ringkasan') + navBtn('guru', '👩‍🏫 Akun Guru') +
      navBtn('siswa', '👥 Semua Siswa') + navBtn('kelas', '🏫 Semua Kelas') + navBtn('rekap', '📊 Rekap Semua') + '</div>' +
    (adminMsg && adminView !== 'siswa' ? '<div class="banner show ' + adminMsg.type + '">' + esc(adminMsg.text) + '</div>' : '') +
    body +
    (adminView === 'ringkasan' ? eksporImporCardHtml('admin') : '');
}
function adminRingkasanHtml(guruAccs, siswaAccs){
  const tgl = todayStr();
  let hadirIni = 0;
  db.attendance.forEach(a => { if(a.date === tgl && a.status === 'Hadir') hadirIni++; });
  return '<div class="card"><h2>Ringkasan Seluruh Data</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat"><div class="num">' + guruAccs.length + '</div><div class="lbl">Akun Guru</div></div>' +
      '<div class="stat"><div class="num">' + siswaAccs.length + '</div><div class="lbl">Akun Siswa</div></div>' +
      '<div class="stat"><div class="num">' + db.classes.length + '</div><div class="lbl">Kelas</div></div>' +
      '<div class="stat"><div class="num">' + db.students.length + '</div><div class="lbl">Siswa Terdaftar</div></div>' +
      '<div class="stat hadir"><div class="num">' + hadirIni + '</div><div class="lbl">Hadir Hari Ini</div></div>' +
      '<div class="stat"><div class="num">' + db.attendance.length + '</div><div class="lbl">Total Catatan Absensi</div></div>' +
    '</div>' +
    '<p class="small muted" style="margin-bottom:0">Dari panel ini admin dapat membuka wilayah akun guru mana pun dan data siswa mana pun — termasuk melihat QR siswa dan mengubah datanya — tanpa perlu masuk sebagai mereka.</p></div>' +
    '<div class="card"><h3>👩‍🏫 Akun Guru Terdaftar</h3>' +
      (guruAccs.length ? guruAccs.map(a => {
        return '<div class="student-row"><div class="student-info"><span class="nm">' + esc(a.email) + '</span>' +
          '<div class="sub">HP ' + esc(a.phone) + ' • ' + guruClasses(a).length + ' kelas • ' + guruStudents(a).length + ' siswa</div></div>' +
          '<div class="icon-btns"><button class="btn small-btn" onclick="adminBukaGuru(\'' + a.id + '\')">Buka Wilayah Guru</button></div></div>';
      }).join('') : '<p class="muted">Belum ada akun guru yang mendaftar di perangkat ini.</p>') + '</div>' +
    '<div class="card"><h3>🎓 Akun Siswa Terdaftar</h3>' +
      (siswaAccs.length ? siswaAccs.map(a => {
        const st = studentOfAccount(a.id);
        return '<div class="student-row"><div class="student-info"><span class="nm">' + esc(a.email) + '</span>' +
          '<div class="sub">HP ' + esc(a.phone) + (st ? ' • Siswa: ' + esc(st.name) + ' (' + esc(className(st.classId)) + ')' : ' • Belum mendaftarkan siswa') + '</div></div>' +
          (st ? '<div class="icon-btns"><button class="btn small-btn" onclick="openQRModal(\'' + st.id + '\')">QR Siswa</button>' +
            '<button class="btn secondary small-btn" onclick="openDetailSiswa(\'' + st.id + '\')">Detail</button>' +
            '<button class="btn secondary small-btn" onclick="adminMulaiUbah(\'' + st.id + '\')">Ubah</button></div>' : '') + '</div>';
      }).join('') : '<p class="muted">Belum ada akun siswa yang mendaftar di perangkat ini.</p>') + '</div>';
}
function barisSiswaAdmin(s){
  return '<div class="student-row">' +
    '<div class="student-info"><span class="nm">' + esc(s.name) + '</span>' +
    '<div class="sub">NISN ' + esc(s.nis || '-') + (s.gender ? ' • ' + esc(s.gender) : '') + ' • ' + esc(className(s.classId)) + ' • ID ' + esc(s.id) + '</div></div>' +
    '<div class="icon-btns">' +
      '<button class="btn small-btn" onclick="openQRModal(\'' + s.id + '\')">QR</button>' +
      '<button class="btn secondary small-btn" onclick="openDetailSiswa(\'' + s.id + '\')">Detail</button>' +
      '<button class="btn secondary small-btn" onclick="adminMulaiUbah(\'' + s.id + '\')">Ubah</button>' +
      '<button class="btn danger small-btn" onclick="adminHapusSiswa(\'' + s.id + '\')">Hapus</button>' +
    '</div></div>';
}
function adminGuruHtml(guruAccs){
  if(!guruAccs.length) return '<div class="card"><p class="muted">Belum ada akun guru di perangkat ini.</p></div>';
  const acc = guruAccs.find(a => a.id === adminGuruId) || guruAccs[0];
  adminGuruId = acc.id;
  const kelas = guruClasses(acc);
  const murid = guruStudents(acc);
  const tgl = todayStr();
  let hadir = 0, tercatat = 0;
  murid.forEach(s => { const r = recordOf(s.id, tgl); if(r){ tercatat++; if(r.status === 'Hadir') hadir++; } });
  let h = '<div class="card"><h2>Wilayah Akun Guru</h2>' +
    '<div class="field"><label for="adm-guru-pilih">Pilih Akun Guru</label><select id="adm-guru-pilih" class="inp" onchange="adminBukaGuru(this.value)">' +
    guruAccs.map(a => '<option value="' + a.id + '"' + (a.id === acc.id ? ' selected' : '') + '>' + esc(a.email) + ' — ' + esc(a.phone) + '</option>').join('') +
    '</select></div>' +
    '<p class="muted" style="margin:0">Guru ini memiliki <b>' + kelas.length + ' kelas</b> dan <b>' + murid.length + ' siswa</b>. Hari ini: ' + tercatat + ' tercatat, ' + hadir + ' hadir. Sebagai admin Anda dapat melihat dan mengubah data mereka dari sini.</p></div>';
  if(!kelas.length) h += '<div class="card"><p class="muted">Guru ini belum membuat kelas.</p></div>';
  kelas.forEach(c => {
    const list = murid.filter(s => s.classId === c.id).slice().sort((a, b) => a.name.localeCompare(b.name, 'id'));
    h += '<div class="card"><h3>🏫 ' + esc(c.name) + ' <span class="muted small">(' + list.length + ' siswa)</span></h3>' +
      (list.length ? list.map(barisSiswaAdmin).join('') : '<p class="muted">Belum ada siswa di kelas ini.</p>') + '</div>';
  });
  return h;
}
function adminSiswaHtml(){
  let h = '';
  if(adminEditId){
    const st = getStudent(adminEditId);
    if(st){
      const kv = adminUbahKeep || kvDariSiswa(st);
      if(!dokAdmin) dokAdmin = Object.assign(dokKosong(), st.dokumen || {});
      h += '<div class="card"><h3>✏️ Ubah Siswa (Admin): ' + esc(st.name) + '</h3>' +
        '<p class="muted" style="margin-top:0">Admin dapat mengubah data siswa mana pun, termasuk identitas lengkap dan dokumennya. Aturan anti-duplikat seluruh identitas tetap berlaku.</p>' +
        (adminMsg ? '<div class="banner show ' + adminMsg.type + '">' + esc(adminMsg.text) + '</div>' : '') +
        '<form onsubmit="return submitAdminUbahSiswa(event)">' +
          identFieldsHtml('adm', kv) +
          dokFieldsHtml('admin', dokAdmin) +
          '<div class="row" style="margin-top:14px"><button class="btn" type="submit">💾 Simpan Perubahan</button>' +
          '<button class="btn secondary" type="button" onclick="adminBatalUbah()">Batal</button></div>' +
        '</form></div>';
    }
  }
  const list = db.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'id'));
  h += '<div class="card"><h3>👥 Semua Siswa di Perangkat Ini (' + list.length + ')</h3>' +
    (list.length ? list.map(barisSiswaAdmin).join('') : '<p class="muted">Belum ada siswa terdaftar.</p>') + '</div>';
  return h;
}
function adminMulaiUbah(sid){
  adminEditId = sid; adminUbahKeep = null; dokAdmin = null; adminMsg = null;
  adminView = 'siswa';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function adminBatalUbah(){
  adminEditId = null; adminUbahKeep = null; dokAdmin = null; adminMsg = null;
  render();
}
function submitAdminUbahSiswa(ev){
  ev.preventDefault();
  const st = getStudent(adminEditId);
  if(!st) return false;
  const v = bacaIdentitas('adm');
  adminUbahKeep = v;
  if(!v.nama) return false;
  const salahA = validasiIdentitas(v);
  if(salahA){
    adminMsg = { type:'err', text:'❌ Data belum valid: ' + salahA };
    render(); return false;
  }
  const hasil = cariKelasForm(v);
  if(hasil.galat){ alert(hasil.galat); return false; }
  let cls = hasil.cls;
  const dupMsg = cekDuplikat(kandidatDari(v, cls), st.id);
  if(dupMsg){ adminMsg = { type:'err', text:'❌ ' + dupMsg }; render(); return false; }
  let kelasBaru = null;
  if(!cls){ kelasBaru = { id: newClassId(), name: v.kelasLain, ownerTeacherId: null }; cls = kelasBaru; }
  const cadangan = JSON.stringify(st);
  if(kelasBaru) db.classes.push(kelasBaru);
  terapkanIdentitas(st, v, cls);
  if(dokAdmin) st.dokumen = Object.assign(dokKosong(), dokAdmin);
  if(!saveDBStrict()){
    const pulih = JSON.parse(cadangan);
    Object.keys(st).forEach(k => delete st[k]);
    Object.assign(st, pulih);
    if(kelasBaru) db.classes = db.classes.filter(c => c.id !== kelasBaru.id);
    adminMsg = { type:'err', text:'❌ ' + PESAN_KUOTA };
    render(); return false;
  }
  adminEditId = null; adminUbahKeep = null; dokAdmin = null; adminMsg = null;
  render();
  return false;
}
function adminHapusSiswa(sid){
  const st = getStudent(sid);
  if(!st) return;
  if(!confirm('Hapus siswa "' + st.name + '" beserta catatan kehadirannya? (Tindakan admin)')) return;
  db.students = db.students.filter(s => s.id !== sid);
  db.attendance = db.attendance.filter(a => a.studentId !== sid);
  if(adminEditId === sid) adminEditId = null;
  saveDB();
  render();
}
function adminKelasHtml(){
  if(!db.classes.length) return '<div class="card"><p class="muted">Belum ada kelas di perangkat ini.</p></div>';
  return '<div class="card"><h3>🏫 Semua Kelas di Perangkat Ini (' + db.classes.length + ')</h3>' +
    db.classes.map(c => {
      const pemilik = c.ownerTeacherId ? db.accounts.find(a => a.id === c.ownerTeacherId) : null;
      const n = db.students.filter(s => s.classId === c.id).length;
      return '<div class="student-row"><div class="student-info"><span class="nm">' + esc(c.name) + '</span>' +
        '<div class="sub">' + n + ' siswa • Pemilik: ' + (pemilik ? esc(pemilik.email) : '— (dari pendaftaran siswa / tanpa guru)') + '</div></div></div>';
    }).join('') + '</div>';
}
function adminRekapHtml(){
  const ym = adminRekapMonth;
  const list = db.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'id'));
  const tot = { Hadir: 0, Sakit: 0, Izin: 0, Alpa: 0 };
  let rows = '';
  list.forEach(s => {
    const c = hitungBulan(s.id, ym);
    const t = c.Hadir + c.Sakit + c.Izin + c.Alpa;
    tot.Hadir += c.Hadir; tot.Sakit += c.Sakit; tot.Izin += c.Izin; tot.Alpa += c.Alpa;
    rows += '<tr><td>' + esc(s.name) + '<div class="sub small muted">' + esc(className(s.classId)) + '</div></td>' +
      '<td class="num">' + c.Hadir + '</td><td class="num">' + c.Sakit + '</td>' +
      '<td class="num">' + c.Izin + '</td><td class="num">' + c.Alpa + '</td>' +
      '<td class="num"><b>' + (t ? Math.round(c.Hadir / t * 100) + '%' : '-') + '</b></td></tr>';
  });
  if(!rows) rows = '<tr><td colspan="6" class="muted">Belum ada siswa.</td></tr>';
  const totAll = tot.Hadir + tot.Sakit + tot.Izin + tot.Alpa;
  return '<div class="card"><h2>Rekap Semua Siswa</h2>' +
    '<p class="muted" style="margin-top:0">Rekap bulan <b>' + fmtBulan(ym) + '</b> untuk seluruh siswa dari semua guru di perangkat ini.</p>' +
    '<div class="row"><div class="field"><label for="adm-rekap-bulan">Bulan</label><input id="adm-rekap-bulan" type="month" class="inp" value="' + ym + '" onchange="adminRekapChange(this.value)"></div></div>' +
    '<div style="margin-bottom:12px"><button class="btn secondary" onclick="unduhRekapCSV(\'admin\')">⬇ Unduh Rekap CSV (Semua Siswa)</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Siswa</th><th class="num">Hadir</th><th class="num">Sakit</th><th class="num">Izin</th><th class="num">Alpa</th><th class="num">% Hadir</th></tr></thead>' +
    '<tbody>' + rows +
    '<tr class="total"><td>Total</td><td class="num">' + tot.Hadir + '</td><td class="num">' + tot.Sakit + '</td>' +
    '<td class="num">' + tot.Izin + '</td><td class="num">' + tot.Alpa + '</td><td class="num">' + (totAll ? Math.round(tot.Hadir / totAll * 100) + '%' : '-') + '</td></tr>' +
    '</tbody></table></div></div>';
}
function adminRekapChange(v){ if(v) adminRekapMonth = v; render(); }
