<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Absensi Siswa</title>
<meta name="description" content="Aplikasi absensi siswa dengan QR code: absensi harian, pindai QR, dan rekap kehadiran.">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root{
    --green:#14532d; --green2:#166534; --accent:#16a34a;
    --bg:#f3f6f3; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e2e8f0;
    --sakit:#d97706; --izin:#2563eb; --alpa:#dc2626;
  }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
  }
  header{
    background:var(--green); color:#fff; padding:14px 16px;
    position:sticky; top:0; z-index:30; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .header-in{ max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ font-weight:800; font-size:20px; display:flex; align-items:center; gap:9px; }
  .brand .logo{ width:34px; height:34px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .brand .logo img{ width:26px; height:26px; }
  .mode-toggle{ display:flex; background:rgba(255,255,255,.16); border-radius:999px; padding:3px; }
  .mode-toggle button{
    border:0; background:transparent; color:#fff; padding:8px 20px; border-radius:999px;
    font-weight:700; font-family:inherit; font-size:15px; cursor:pointer;
  }
  .mode-toggle button.active{ background:#fff; color:var(--green); }
  main{ max-width:980px; margin:0 auto; padding:16px 16px 40px; }
  footer{ max-width:980px; margin:0 auto; padding:0 16px 28px; color:var(--muted); font-size:13px; text-align:center; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:12px; scrollbar-width:thin; }
  .tabs button{
    border:1.5px solid var(--green2); background:#fff; color:var(--green);
    padding:9px 16px; border-radius:999px; font-weight:700; font-family:inherit; font-size:14px;
    cursor:pointer; white-space:nowrap; flex:0 0 auto;
  }
  .tabs button.active{ background:var(--green); color:#fff; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(16,24,40,.05);
  }
  .card h2{ margin:0 0 6px; font-size:18px; }
  .card h3{ margin:0 0 8px; font-size:16px; }
  .muted{ color:var(--muted); }
  .small{ font-size:13px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > *{ flex:1 1 160px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-weight:600; font-size:14px; margin-bottom:5px; }
  .inp, select.inp, textarea.inp{
    width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px;
    font:inherit; font-size:15px; background:#fff; color:var(--ink);
  }
  .inp:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .btn{
    background:var(--green2); color:#fff; border:0; padding:11px 18px; border-radius:10px;
    font-weight:700; font-family:inherit; font-size:15px; cursor:pointer; display:inline-block; text-align:center;
  }
  .btn:hover{ background:var(--green); }
  .btn.secondary{ background:#fff; color:var(--green); border:1.5px solid var(--green2); }
  .btn.secondary:hover{ background:#f0fdf4; }
  .btn.danger{ background:#fff; color:var(--alpa); border:1.5px solid #fca5a5; }
  .btn.small-btn{ padding:7px 12px; font-size:13px; border-radius:8px; }
  .btn.block{ width:100%; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .stat{ border-radius:12px; padding:14px; text-align:center; border:1px solid var(--line); background:#f8fafc; }
  .stat .num{ font-size:28px; font-weight:800; line-height:1.1; }
  .stat .lbl{ font-size:13px; font-weight:600; color:var(--muted); }
  .stat.hadir{ background:#f0fdf4; } .stat.hadir .num{ color:var(--accent); }
  .stat.sakit .num{ color:var(--sakit); } .stat.izin .num{ color:var(--izin); } .stat.alpa .num{ color:var(--alpa); }

  .progress{ height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; }
  .progress > div{ height:100%; background:var(--accent); border-radius:999px; }
  .class-progress{ margin-bottom:12px; }
  .class-progress .cp-head{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px; gap:8px; }

  .banner{ padding:12px 14px; border-radius:10px; margin-bottom:12px; font-weight:600; font-size:15px; display:none; }
  .banner.show{ display:block; }
  .banner.ok{ background:#dcfce7; color:#14532d; border:1px solid #86efac; }
  .banner.err{ background:#fee2e2; color:#7f1d1d; border:1px solid #fca5a5; }
  .banner.info{ background:#dbeafe; color:#1e3a8a; border:1px solid #93c5fd; }

  .student-row{
    display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .student-row:last-child{ border-bottom:0; }
  .student-info{ flex:1 1 150px; min-width:0; }
  .student-info .nm{ font-weight:700; overflow-wrap:anywhere; }
  .student-info .sub{ font-size:13px; color:var(--muted); }
  .chip{
    display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:#dcfce7; color:#14532d; margin-left:6px; vertical-align:middle; white-space:nowrap;
  }
  .st-btns{ display:flex; gap:6px; flex:0 0 auto; }
  .st-btn{
    min-width:42px; height:42px; padding:0 8px; border-radius:10px; border:2px solid var(--line);
    background:#fff; font-weight:800; font-family:inherit; font-size:14px; cursor:pointer; color:var(--muted);
  }
  .st-btn .lbl-full{ display:none; }
  .st-btn.active[data-st="Hadir"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .st-btn.active[data-st="Sakit"]{ background:var(--sakit); border-color:var(--sakit); color:#fff; }
  .st-btn.active[data-st="Izin"]{ background:var(--izin); border-color:var(--izin); color:#fff; }
  .st-btn.active[data-st="Alpa"]{ background:var(--alpa); border-color:var(--alpa); color:#fff; }
  @media (min-width:680px){
    .st-btn{ min-width:74px; }
    .st-btn .lbl-full{ display:inline; }
    .st-btn .lbl-short{ display:none; }
  }
  .note-inp{ flex:1 1 140px; }

  .icon-btns{ display:flex; gap:6px; flex:0 0 auto; }
  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th, td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
  th{ font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  td.num, th.num{ text-align:center; }
  tr.total td{ font-weight:800; background:#f0fdf4; }
  .table-wrap{ overflow-x:auto; }
  .status-dot{ display:inline-block; padding:2px 10px; border-radius:999px; color:#fff; font-size:12.5px; font-weight:700; }
  .status-dot.Hadir{ background:var(--accent); } .status-dot.Sakit{ background:var(--sakit); }
  .status-dot.Izin{ background:var(--izin); } .status-dot.Alpa{ background:var(--alpa); }

  video.scan-video{ width:100%; max-height:420px; background:#111; border-radius:12px; object-fit:cover; }
  .qr-big{ text-align:center; }
  .qr-big canvas{ max-width:78vw; height:auto; border:1px solid var(--line); border-radius:12px; }

  .modal-back{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
    z-index:60; padding:16px;
  }
  .modal{ background:#fff; border-radius:16px; padding:22px; max-width:380px; width:100%; text-align:center; max-height:92vh; overflow-y:auto; }
  .modal canvas{ max-width:100%; height:auto; }
  .empty{ text-align:center; padding:26px 14px; color:var(--muted); }
  .empty .big{ font-size:40px; margin-bottom:8px; }
  .hist-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .hist-row:last-child{ border-bottom:0; }

  .doc-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .doc-box{ border:1px dashed #cbd5e1; border-radius:10px; padding:10px; text-align:center; }
  .doc-box .doc-lbl{ font-weight:700; font-size:13.5px; margin-bottom:6px; }
  .doc-box img{ max-width:100%; max-height:150px; border-radius:8px; border:1px solid var(--line); }
  .doc-box .doc-none{ font-size:13px; color:var(--muted); padding:14px 4px; }
  .doc-view img{ max-width:100%; border-radius:10px; border:1px solid var(--line); }
  input[type="file"].inp{ padding:8px 10px; font-size:13.5px; }
  table.ident{ font-size:14.5px; }
  table.ident td:first-child{ color:var(--muted); font-weight:600; width:42%; }
  .badge-admin{ display:inline-block; font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px; background:#fef3c7; color:#92400e; border:1px solid #f59e0b; margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .form-sub{ font-weight:800; font-size:14px; margin:16px 0 8px; color:var(--green); }

  #print-area{ display:none; }
  @media print{
    #app{ display:none !important; }
    #print-area{ display:grid !important; grid-template-columns:repeat(3,1fr); gap:12px; padding:10px; }
    .qr-card{ border:1.5px dashed #888; border-radius:10px; padding:12px 8px; text-align:center; page-break-inside:avoid; }
    .qr-card canvas{ max-width:100%; height:auto; }
    .qr-card .qc-name{ font-weight:800; margin-top:6px; font-size:14px; }
    .qr-card .qc-sub{ font-size:12px; color:#444; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-in">
      <div class="brand"><span class="logo"><img src="icon-192.png" alt=""></span> Absensi Siswa</div>
      <div class="mode-toggle" role="tablist" aria-label="Pilih mode">
        <button id="mode-guru" onclick="setMode('guru')">Guru</button>
        <button id="mode-siswa" onclick="setMode('siswa')">Siswa</button>
        <button id="mode-admin" onclick="setMode('admin')">Admin</button>
      </div>
    </div>
  </header>
  <main>
    <div id="guru-view">
      <div id="guru-gate" style="display:none"></div>
      <div id="guru-main">
      <div id="guru-akunbar"></div>
      <nav class="tabs" id="guru-tabs">
        <button data-tab="beranda" onclick="switchTab('beranda')">🏠 Beranda</button>
        <button data-tab="absensi" onclick="switchTab('absensi')">📝 Absensi</button>
        <button data-tab="pindai" onclick="switchTab('pindai')">📷 Pindai</button>
        <button data-tab="siswa" onclick="switchTab('siswa')">👥 Siswa</button>
        <button data-tab="rekap" onclick="switchTab('rekap')">📊 Rekap</button>
      </nav>
      <section id="tab-beranda"></section>
      <section id="tab-absensi"></section>
      <section id="tab-pindai"></section>
      <section id="tab-siswa"></section>
      <section id="tab-rekap"></section>
      </div>
    </div>
    <div id="siswa-view" style="display:none"></div>
    <div id="admin-view" style="display:none"></div>
  </main>
  <footer>Absensi Siswa — semua data tersimpan aman di perangkat ini (tidak dikirim ke server mana pun).</footer>
</div>
<div id="print-area"></div>
<div id="modal-root"></div>

<script src="qrcode.js"></script>
<script src="jsQR.js"></script>
<script>
'use strict';
/* ============================== DATA ============================== */
const DB_KEY = 'absensiSiswa.v1';
const MODE_KEY = 'absensiSiswa.mode';
const STATUSES = [
  { k:'Hadir', short:'H' },
  { k:'Sakit', short:'S' },
  { k:'Izin',  short:'I' },
  { k:'Alpa',  short:'A' }
];

/* Kolom identitas lengkap seorang siswa (di luar id/nama/nis/jk/kelas).
   Dipakai formulir pendaftaran, Edit Identitas, dan pemeriksaan duplikat. */
const IDENT_FIELDS = ['ayah','ibu','anakKe','alamat','nik','email','hp','tempatLahir','tglLahir'];
const DOK_KEYS = ['kk','ktpAyah','ktpIbu'];
const DOK_LABEL = { kk:'Kartu Keluarga (KK)', ktpAyah:'KTP Ayah', ktpIbu:'KTP Ibu' };

/* Lengkapi catatan siswa lama dengan kolom identitas/dokumen kosong. */
function normStudent(s){
  IDENT_FIELDS.forEach(f => { if(s[f] == null) s[f] = ''; });
  if(!s.dokumen || typeof s.dokumen !== 'object') s.dokumen = {};
  DOK_KEYS.forEach(k => {
    // Hanya data URL gambar yang dipertahankan; nilai lain dibuang demi keamanan.
    if(typeof s.dokumen[k] !== 'string' || (s.dokumen[k] && s.dokumen[k].indexOf('data:image/') !== 0)) s.dokumen[k] = '';
  });
  return s;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.classes) && Array.isArray(d.students) && Array.isArray(d.attendance)){
        if(!Array.isArray(d.accounts)) d.accounts = [];
        // Akun lama (dibuat sebelum ada peran) dianggap akun Siswa.
        d.accounts.forEach(a => { if(!a.role) a.role = 'siswa'; });
        // Kelas lama belum punya pemilik guru.
        d.classes.forEach(c => { if(c.ownerTeacherId === undefined) c.ownerTeacherId = null; });
        d.students.forEach(normStudent);
        return d;
      }
    }
  }catch(e){}
  return { classes:[], students:[], attendance:[], accounts:[], myStudentId:null };
}
let db = loadDB();
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
/* Simpan dengan laporan keberhasilan — dipakai saat menyimpan foto dokumen,
   agar kuota localStorage yang terlampaui ketahuan dan bisa ditolak dengan jelas. */
function saveDBStrict(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch(e){ return false; }
}
const PESAN_KUOTA = 'Penyimpanan perangkat penuh: data tidak dapat disimpan karena kuota penyimpanan peramban (localStorage) terlampaui — kemungkinan foto dokumen terlalu besar/banyak. Coba unggah foto yang lebih kecil atau hapus sebagian data lama, lalu simpan lagi.';

const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function randCode(len){
  let s = '';
  try{
    const a = new Uint8Array(len); crypto.getRandomValues(a);
    a.forEach(b => { s += ALPHABET[b % ALPHABET.length]; });
  }catch(e){
    for(let i=0;i<len;i++) s += ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
  }
  return s;
}
function newStudentId(){
  let id; let tries = 0;
  do { id = randCode(8); tries++; } while (db.students.some(s => s.id === id) && tries < 50);
  return id;
}
function newClassId(){
  let id; let tries = 0;
  do { id = 'K' + randCode(7); tries++; } while (db.classes.some(c => c.id === id) && tries < 50);
  return id;
}

/* ============================== BANTUAN (UTIL) ============================== */
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function nowTime(){
  const d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtTgl(ymd){
  if(!ymd) return '-';
  const p = ymd.split('-').map(Number);
  const dt = new Date(p[0], p[1]-1, p[2]);
  return HARI[dt.getDay()] + ', ' + p[2] + ' ' + BULAN[p[1]-1] + ' ' + p[0];
}
function fmtBulan(ym){
  const p = ym.split('-').map(Number);
  return BULAN[p[1]-1] + ' ' + p[0];
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getClass(id){ return db.classes.find(c => c.id === id) || null; }
function className(id){ const c = getClass(id); return c ? c.name : '-'; }
function getStudent(id){ return db.students.find(s => s.id === id) || null; }
function findClassByName(name, ownerId){
  const n = String(name || '').trim().toLowerCase();
  if(!n) return null;
  return db.classes.find(c => c.name.trim().toLowerCase() === n &&
    (ownerId === undefined || (c.ownerTeacherId || null) === ownerId)) || null;
}
/* Pemisahan data per guru: guru yang masuk hanya melihat kelas miliknya
   (ownerTeacherId = id akunnya) dan siswa di kelas-kelas itu. */
function guruClasses(acc){
  if(!acc) return [];
  return db.classes.filter(c => c.ownerTeacherId === acc.id);
}
function guruStudents(acc){
  const ids = guruClasses(acc).map(c => c.id);
  return db.students.filter(s => ids.indexOf(s.classId) !== -1);
}
function classOptionsFrom(list, selected, withAll){
  let h = '';
  if(withAll) h += '<option value="">Semua Kelas</option>';
  list.forEach(c => {
    h += '<option value="' + c.id + '"' + (selected === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  });
  return h;
}
function recordOf(studentId, date){
  return db.attendance.find(a => a.studentId === studentId && a.date === date) || null;
}
function upsertAttendance(studentId, date, status, note){
  const ex = recordOf(studentId, date);
  if(ex){ ex.status = status; ex.note = note || ''; if(!ex.time) ex.time = nowTime(); }
  else db.attendance.push({ studentId, date, status, note: note || '', time: nowTime() });
}
function studentsOfClass(classId){
  return db.students
    .filter(s => !classId || s.classId === classId)
    .slice()
    .sort((a,b) => a.name.localeCompare(b.name, 'id'));
}
function showBanner(el, type, msg){
  if(!el) return;
  el.className = 'banner show ' + type;
  el.textContent = msg;
}
function hideBanner(el){ if(el){ el.className = 'banner'; el.textContent = ''; } }
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.15);
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 300);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
}

/* ============================== NAVIGASI ============================== */
let mode = localStorage.getItem(MODE_KEY) || 'guru';
if(mode !== 'guru' && mode !== 'siswa' && mode !== 'admin') mode = 'guru';
let guruTab = 'beranda';

function setMode(m){
  mode = m;
  try{ localStorage.setItem(MODE_KEY, m); }catch(e){}
  if(m !== 'guru') stopCamera();
  editMine = false;
  akunMsg = null;
  guruMsg = null;
  adminMsg = null;
  render();
}
function switchTab(t){
  guruTab = t;
  if(t !== 'pindai') stopCamera();
  if(t === 'absensi') absenLoadDraft();
  render();
}
function render(){
  document.getElementById('mode-guru').classList.toggle('active', mode === 'guru');
  document.getElementById('mode-siswa').classList.toggle('active', mode === 'siswa');
  document.getElementById('mode-admin').classList.toggle('active', mode === 'admin');
  document.getElementById('guru-view').style.display = mode === 'guru' ? '' : 'none';
  document.getElementById('siswa-view').style.display = mode === 'siswa' ? '' : 'none';
  document.getElementById('admin-view').style.display = mode === 'admin' ? '' : 'none';
  if(mode === 'guru'){
    const acc = currentAccount();
    const isGuru = !!acc && acc.role === 'guru';
    document.getElementById('guru-gate').style.display = isGuru ? 'none' : '';
    document.getElementById('guru-main').style.display = isGuru ? '' : 'none';
    if(!isGuru){ renderGerbangGuru(document.getElementById('guru-gate')); return; }
    document.getElementById('guru-akunbar').innerHTML =
      '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<span class="small">👩‍🏫 Masuk sebagai Guru <b>' + esc(acc.email) + '</b> — Anda hanya melihat kelas &amp; siswa milik Anda.</span>' +

}

        '<div class="stat alpa"><div class="num">' + counts.Alpa + '</div><div class="lbl">Alpa</div></div>' +

let scanStream = null;
let scanRAF = null;
let scanCooldownUntil = 0;
let pindaiMsg = null; // {type, text} pesan terakhir di tab Pindai

function renderPindai(){
  const el = document.getElementById('tab-pindai');
  const camSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

      '<div id="pindai-banner" class="banner"></div>' +
      (camSupported
        ? '<video id="scan-video" class="scan-video" playsinline muted style="display:none"></video>' +
          '<div class="row" style="margin:12px 0">' +
            '<button class="btn" id="btn-cam-start" onclick="startCamera()">📷 Nyalakan Kamera</button>' +
            '<button class="btn secondary" id="btn-cam-stop" onclick="stopCamera()" style="display:none">Matikan Kamera</button>' +
          '</div>'
        : '<div class="banner info show">Kamera tidak tersedia di perangkat/peramban ini. Gunakan kolom kode manual di bawah — caranya sama.</div>') +
      '<canvas id="scan-canvas" style="display:none"></canvas>' +
      '<div class="field"><label for="manual-code">Kode Manual</label>' +
        '<input id="manual-code" class="inp" placeholder="Ketik / tempel ID siswa atau isi QR" autocomplete="off"></div>' +
      '<button class="btn block" onclick="prosesKodeManual()">Proses Kode</button>' +
      '<p class="small muted">ID siswa tercantum di bawah QR pada kartu QR siswa.</p>' +
    '</div>';
  if(pindaiMsg) showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
  if(scanStream){
    const v = document.getElementById('scan-video');
    if(v){ v.style.display = ''; v.srcObject = scanStream; }
    const b1 = document.getElementById('btn-cam-start'); if(b1) b1.style.display = 'none';
    const b2 = document.getElementById('btn-cam-stop'); if(b2) b2.style.display = '';
  }
}
async function startCamera(){
  const banner = document.getElementById('pindai-banner');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    showBanner(banner, 'err', 'Kamera tidak bisa dibuka (' + esc(e && e.name ? e.name : 'izin ditolak') + '). Periksa izin kamera, atau gunakan kolom Kode Manual di bawah.');
    return;
  }
  const v = document.getElementById('scan-video');
  if(!v){ stopCamera(); return; }
  v.style.display = '';
  v.srcObject = scanStream;
  try{ await v.play(); }catch(e){}
  const b1 = document.getElementById('btn-cam-start'); if(b1) b1.style.display = 'none';
  const b2 = document.getElementById('btn-cam-stop'); if(b2) b2.style.display = '';
  hideBanner(banner);
  scanTick();
}
function stopCamera(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
  if(scanStream){
    scanStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
    scanStream = null;
  }
  const v = document.getElementById('scan-video');
  if(v){ v.srcObject = null; v.style.display = 'none'; }
  const b1 = document.getElementById('btn-cam-start'); if(b1) b1.style.display = '';
  const b2 = document.getElementById('btn-cam-stop'); if(b2) b2.style.display = 'none';
}
function scanTick(){
  if(!scanStream) return;
  const v = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');
  if(v && canvas && v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth > 0){
    canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    try{
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = (typeof jsQR === 'function') ? jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }) : null;
      if(code && code.data && Date.now() > scanCooldownUntil){
        scanCooldownUntil = Date.now() + 3000;
        handleScan(code.data);
      }
    }catch(e){}
  }
  scanRAF = requestAnimationFrame(scanTick);
}
function prosesKodeManual(){
  const inp = document.getElementById('manual-code');
  const val = (inp.value || '').trim();
  if(!val){
    pindaiMsg = { type:'err', text:'Kolom kode masih kosong. Ketik ID siswa atau tempel isi QR.' };
    showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
    return;
  }
  handleScan(val);
  inp.value = '';
}
/* Logika inti pindai — dipakai kamera dan kode manual.
   Mengembalikan & menampilkan pesan hasil. */
function handleScan(text){
  let payload = null;
  try{
    const j = JSON.parse(text);
    if(j && j.app === 'absensi-siswa' && j.id) payload = j;
  }catch(e){}
  const sid = payload ? String(payload.id) : String(text || '').trim();
  const acc = currentAccount();
  let st = getStudent(sid);

  if(st && acc && acc.role === 'guru'){
    const kls = getClass(st.classId);
    if(!kls || kls.ownerTeacherId !== acc.id){
      pindaiMsg = { type:'err', text:'Siswa "' + st.name + '" terdaftar pada kelas milik akun guru lain di perangkat ini. Kehadiran tidak dicatat di akun Anda agar data antar-guru tidak tercampur.' };
      showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
      return;
    }
  }

  if(!st && payload && payload.nama){
    // Siswa belum dikenal: impor dari isi QR ke kelas milik guru yang masuk
    // (dengan penjaga anti-duplikat seluruh identitas).
    let cls = acc ? findClassByName(payload.kelas, acc.id) : findClassByName(payload.kelas);
    const candScan = normStudent({
      name: String(payload.nama),
      nis: payload.nis ? String(payload.nis) : '',
      gender: '',
      classId: cls ? cls.id : '__kelas-baru__'
    });
    const dupScan = cekDuplikat(candScan, null);
    if(dupScan){
      pindaiMsg = { type:'err', text:'❌ Impor dari QR dibatalkan — ' + dupScan };
      showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
      return;
    }
    if(!cls){
      cls = { id: newClassId(), name: String(payload.kelas || 'Tanpa Kelas').trim() || 'Tanpa Kelas', ownerTeacherId: acc ? acc.id : null };
      db.classes.push(cls);
    }
    st = normStudent({ id: sid, name: candScan.name, nis: candScan.nis, gender: '', classId: cls.id });
    db.students.push(st);
    saveDB();
  }
  if(!st){
    pindaiMsg = { type:'err', text:'Kode tidak dikenal: "' + sid + '". Pastikan ID siswa benar atau minta siswa menunjukkan QR pribadinya.' };
    showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
    return;
  }
  const tgl = todayStr();
  const ex = recordOf(st.id, tgl);
  if(ex){
    if(ex.status === 'Hadir'){
      pindaiMsg = { type:'info', text: st.name + ' sudah tercatat Hadir hari ini (' + (ex.time || '-') + ').' };
    } else {
      pindaiMsg = { type:'info', text: st.name + ' sudah tercatat hari ini dengan status ' + ex.status + ' — catatan tidak diubah.' };
    }
    showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
    return;
  }
  db.attendance.push({ studentId: st.id, date: tgl, status: 'Hadir', note: '', time: nowTime() });
  saveDB();
  beep();
  pindaiMsg = { type:'ok', text: '✅ Hadir: ' + st.name + ' (' + className(st.classId) + ') — ' + nowTime() };
  showBanner(document.getElementById('pindai-banner'), pindaiMsg.type, pindaiMsg.text);
}

/* ============================== QR ============================== */
function qrPayload(st){
  return JSON.stringify({
    app: 'absensi-siswa', v: 1,
    id: st.id, nama: st.name, nis: st.nis || '', kelas: className(st.classId)
  });
}
function drawQR(canvas, text, cell){
  cell = cell || 8;
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const quiet = 4;
  const size = (n + quiet * 2) * cell;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  for(let r = 0; r < n; r++)
    for(let c = 0; c < n; c++)
      if(qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
  return size;
}
/* Kanvas kartu lengkap (QR + nama + NIS + kelas) untuk diunduh sebagai PNG. */
function drawCardCanvas(st, cell){
  cell = cell || 10;
  const qr = qrcode(0, 'M');
  qr.addData(qrPayload(st));
  qr.make();
  const n = qr.getModuleCount();
  const quiet = 4;
  const qrSize = (n + quiet * 2) * cell;
  const W = Math.max(qrSize + 48, 380);
  const H = qrSize + 138;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#14532d'; ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.fillStyle = '#000000';
  const offX = (W - qrSize) / 2, offY = 18;
  for(let r = 0; r < n; r++)
    for(let c = 0; c < n; c++)
      if(qr.isDark(r, c)) ctx.fillRect(offX + (c + quiet) * cell, offY + (r + quiet) * cell, cell, cell);
  ctx.textAlign = 'center';
  let fs = 27;
  ctx.fillStyle = '#14532d';
  ctx.font = '800 ' + fs + 'px "Plus Jakarta Sans", system-ui, sans-serif';
  while(ctx.measureText(st.name).width > W - 28 && fs > 14){
    fs -= 2; ctx.font = '800 ' + fs + 'px "Plus Jakarta Sans", system-ui, sans-serif';
  }
  ctx.fillText(st.name, W / 2, qrSize + 62);
  ctx.fillStyle = '#374151';
  ctx.font = '600 19px "Plus Jakarta Sans", system-ui, sans-serif';
  ctx.fillText('NISN ' + (st.nis || '-') + ' • ' + className(st.classId), W / 2, qrSize + 92);
  ctx.fillStyle = '#6b7280';
  ctx.font = '15px "Plus Jakarta Sans", system-ui, sans-serif';
  ctx.fillText('ID: ' + st.id + ' • Absensi Siswa', W / 2, qrSize + 120);
  return canvas;
}
function unduhQR(sid){
  const st = getStudent(sid);
  if(!st) return;
  const card = drawCardCanvas(st, 10);
  const a = document.createElement('a');
  a.download = 'QR-' + st.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.png';
  a.href = card.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
}
function openQRModal(sid){
  const st = getStudent(sid);
  if(!st) return;
  const root = document.getElementById('modal-root');
  root.innerHTML =

        '<div style="font-weight:800;font-size:17px;margin-top:8px">' + esc(st.name) + '</div>' +

        '</div>' +
        '<button class="btn secondary block" style="margin-top:10px" onclick="closeModal()">Tutup</button>' +
      '</div>' +

/* ============================== DETAIL SISWA ==============================
   Menampilkan identitas lengkap + foto dokumen seorang siswa. Dipakai guru
   (dari daftar siswanya), siswa (datanya sendiri), dan admin (semua siswa). */
function barisIdent(label, val){

function siswaFilterChange(v){ siswaClassFilter = v; renderSiswaGuru(); }
function submitKelas(ev){
  ev.preventDefault();
  const acc = currentAccount();
  const nama = document.getElementById('kls-nama').value.trim();
  if(!nama || !acc) return false;
  if(nama.length > 60){ alert('Nama kelas terlalu panjang (maks. 60 karakter).'); return false; }
  if(findClassByName(nama, acc.id)){ alert('Anda sudah memiliki kelas "' + nama + '".'); return false; }
  db.classes.push({ id: newClassId(), name: nama, ownerTeacherId: acc.id });
  saveDB();
  renderSiswaGuru();
  showBanner(document.getElementById('siswa-banner'), 'ok', '✅ Kelas "' + nama + '" ditambahkan sebagai kelas Anda.');
  return false;
}
function hapusKelas(cid){
  const c = getClass(cid);
  if(!c) return;
  const n = db.students.filter(s => s.classId === cid).length;
  if(!confirm('Hapus kelas "' + c.name + '"?' + (n ? ' ' + n + ' siswa di dalamnya beserta catatan kehadirannya juga akan terhapus.' : ''))) return;
  const removedIds = db.students.filter(s => s.classId === cid).map(s => s.id);
  db.attendance = db.attendance.filter(a => removedIds.indexOf(a.studentId) === -1);
  db.students = db.students.filter(s => s.classId !== cid);
  db.classes = db.classes.filter(x => x.id !== cid);
  if(db.myStudentId && removedIds.indexOf(db.myStudentId) !== -1) db.myStudentId = null;
  if(siswaClassFilter === cid) siswaClassFilter = '';
  if(absenClass === cid) absenClass = '';
  saveDB();
  renderSiswaGuru();
}
function submitSiswa(ev){
  ev.preventDefault();
  const nama = document.getElementById('f-nama').value.trim();
  const nis = document.getElementById('f-nis').value.trim();
  const gender = document.getElementById('f-gender').value;
  const kelas = document.getElementById('f-kelas').value;
  if(!nama) return false;
  const salahS = validasiNamaNis(nama, nis);
  if(salahS){ alert('❌ Data belum valid: ' + salahS); return false; }
  // Kandidat duplikat = hasil akhir catatan (ubahan digabung data lama),
  // diperiksa dengan aturan seluruh-identitas.
  const dasar = editStudentId ? (getStudent(editStudentId) || {}) : {};
  const candS = Object.assign({}, dasar, { name: nama, nis: nis, gender: gender, classId: kelas });
  const dupMsgS = cekDuplikat(candS, editStudentId || null);
  if(dupMsgS){
    alert('❌ ' + dupMsgS);
    showBanner(document.getElementById('siswa-banner'), 'err', '❌ ' + dupMsgS);
    return false;
  }
  if(editStudentId){
    const st = getStudent(editStudentId);
    if(st){ st.name = nama; st.nis = nis; st.gender = gender; st.classId = kelas; }
    editStudentId = null;
    saveDB();
    renderSiswaGuru();
    showBanner(document.getElementById('siswa-banner'), 'ok', '✅ Data siswa diperbarui.');
  } else {
    db.students.push(normStudent({ id: newStudentId(), name: nama, nis: nis, gender: gender, classId: kelas }));
    saveDB();
    renderSiswaGuru();
    showBanner(document.getElementById('siswa-banner'), 'ok', '✅ Siswa "' + nama + '" ditambahkan.');
  }
  return false;
}
function mulaiUbah(sid){ editStudentId = sid; renderSiswaGuru(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function batalUbah(){ editStudentId = null; renderSiswaGuru(); }
function hapusSiswa(sid){
  const st = getStudent(sid);
  if(!st) return;
  if(!confirm('Hapus siswa "' + st.name + '" beserta catatan kehadirannya?')) return;
  db.students = db.students.filter(s => s.id !== sid);
  db.attendance = db.attendance.filter(a => a.studentId !== sid);
  if(db.myStudentId === sid) db.myStudentId = null;
  if(editStudentId === sid) editStudentId = null;
  saveDB();
  renderSiswaGuru();
}
function submitBulk(ev){
  ev.preventDefault();
  const kelas = document.getElementById('bulk-kelas').value;
  const teks = document.getElementById('bulk-teks').value;
  let n = 0, skip = 0;
  teks.split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if(!t) return;
    const parts = t.split(';');
    const nama = (parts[0] || '').trim();
    const nis = (parts[1] || '').trim();
    if(!nama) return;
    if(validasiNamaNis(nama, nis)){ skip++; return; }
    if(cekDuplikat(normStudent({ name: nama, nis: nis, gender: '', classId: kelas }), null)){ skip++; return; }
    db.students.push(normStudent({ id: newStudentId(), name: nama, nis: nis, gender: '', classId: kelas }));
    n++;
  });
  saveDB();
  renderSiswaGuru();
  let bulkMsg;
  if(n && skip) bulkMsg = '✅ ' + n + ' siswa ditambahkan. ' + skip + ' baris dilewati karena seluruh identitasnya duplikat persis dengan siswa yang sudah ada.';
  else if(n) bulkMsg = '✅ ' + n + ' siswa ditambahkan.';
  else if(skip) bulkMsg = 'Semua baris dilewati: seluruh identitasnya duplikat persis dengan siswa yang sudah ada.';
  else bulkMsg = 'Tidak ada baris yang valid. Gunakan format Nama;NISN per baris.';
  showBanner(document.getElementById('siswa-banner'), n ? 'ok' : 'err', bulkMsg);
  return false;
}

let rekapMonth = todayStr().slice(0, 7);  // 'YYYY-MM'
let rekapClass = '';

function renderRekap(){
  const el = document.getElementById('tab-rekap');
  const acc = currentAccount();
  const myClasses = guruClasses(acc);
  if(myClasses.length === 0){
    el.innerHTML = '<div class="card"><div class="empty"><div class="big">📊</div>' +
      '<p>Belum ada data untuk direkap. Tambahkan kelas dan siswa di tab <b>Siswa</b>, lalu isi absensi.</p></div></div>';
    return;
  }
  if(rekapClass && !myClasses.some(c => c.id === rekapClass)) rekapClass = '';
  const mine = guruStudents(acc);
  const list = (rekapClass ? mine.filter(s => s.classId === rekapClass) : mine)
    .slice().sort((a,b) => a.name.localeCompare(b.name, 'id'));
  const tot = { Hadir:0, Sakit:0, Izin:0, Alpa:0 };
  let rows = '';
  list.forEach(s => {
    const c = { Hadir:0, Sakit:0, Izin:0, Alpa:0 };
    db.attendance.forEach(a => {
      if(a.studentId === s.id && a.date.indexOf(rekapMonth) === 0 && c[a.status] != null) c[a.status]++;
    });
    const total = c.Hadir + c.Sakit + c.Izin + c.Alpa;
    const pct = total ? Math.round(c.Hadir / total * 100) + '%' : '-';
    tot.Hadir += c.Hadir; tot.Sakit += c.Sakit; tot.Izin += c.Izin; tot.Alpa += c.Alpa;
    rows += '<tr><td>' + esc(s.name) + '<div class="sub small muted">' + esc(className(s.classId)) + '</div></td>' +
      '<td class="num">' + c.Hadir + '</td><td class="num">' + c.Sakit + '</td>' +
      '<td class="num">' + c.Izin + '</td><td class="num">' + c.Alpa + '</td>' +
      '<td class="num"><b>' + pct + '</b></td></tr>';
  });
  if(!rows) rows = '<tr><td colspan="6" class="muted">Tidak ada siswa pada pilihan kelas ini.</td></tr>';
  const totAll = tot.Hadir + tot.Sakit + tot.Izin + tot.Alpa;
  const totPct = totAll ? Math.round(tot.Hadir / totAll * 100) + '%' : '-';

  el.innerHTML =
    '<div class="card"><h2>Rekap Kehadiran</h2>' +
      '<p class="muted" style="margin-top:0">Rekap bulan <b>' + fmtBulan(rekapMonth) + '</b> — persentase hadir dihitung dari catatan yang ada pada bulan itu.</p>' +
      '<div class="row">' +
        '<div class="field"><label for="rekap-bulan">Bulan</label><input id="rekap-bulan" type="month" class="inp" value="' + rekapMonth + '" onchange="rekapFilterChange()"></div>' +
        '<div class="field"><label for="rekap-kelas">Kelas</label><select id="rekap-kelas" class="inp" onchange="rekapFilterChange()">' + classOptionsFrom(myClasses, rekapClass, true) + '</select></div>' +
      '</div>' +
      '<div style="margin-bottom:12px"><button class="btn secondary" onclick="unduhRekapCSV(\'guru\')">⬇ Unduh Rekap CSV (Bulan &amp; Kelas Ini)</button></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>Siswa</th><th class="num">Hadir</th><th class="num">Sakit</th><th class="num">Izin</th><th class="num">Alpa</th><th class="num">% Hadir</th></tr></thead>' +
        '<tbody>' + rows +
        '<tr class="total"><td>Total</td><td class="num">' + tot.Hadir + '</td><td class="num">' + tot.Sakit + '</td>' +
        '<td class="num">' + tot.Izin + '</td><td class="num">' + tot.Alpa + '</td><td class="num">' + totPct + '</td></tr>' +
        '</tbody></table></div>' +
    '</div>';
}
function rekapFilterChange(){
  const b = document.getElementById('rekap-bulan');
  const k = document.getElementById('rekap-kelas');
  if(b && b.value) rekapMonth = b.value;
  if(k) rekapClass = k.value;
  renderRekap();

/* ============================== EKSPOR & IMPOR DATA ==============================
   Jalur cadangan versi mandiri ini: Admin mengekspor SELURUH data perangkat,
   Guru mengekspor data miliknya saja — masing-masing satu berkas JSON.
   Impor menggabungkan isi berkas ke data yang ada (catatan yang sudah ada
   dilewati, tidak ditimpa). Akun TIDAK dibuat lewat impor oleh guru; impor
   admin memulihkan akun dari berkas cadangan sebagaimana adanya. */
function unduhBerkas(nama, konten, tipe){
  const blob = new Blob([konten], { type: tipe });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} }, 3000);
}
function eksporData(scope){
  let data;
  if(scope === 'admin'){
    data = { classes: db.classes, students: db.students, attendance: db.attendance, accounts: db.accounts };
  } else {
    const acc = currentAccount();
    if(!acc) return;
    const cls = guruClasses(acc);
    const cids = cls.map(c => c.id);
    const sts = db.students.filter(s => cids.indexOf(s.classId) !== -1);
    const sids = sts.map(s => s.id);
    data = {
      classes: cls, students: sts,
      attendance: db.attendance.filter(a => sids.indexOf(a.studentId) !== -1),
      accounts: db.accounts.filter(a => a.id === acc.id)
    };
  }
  const paket = { app: 'absensi-siswa', jenis: 'ekspor-data', v: 1, cakupan: scope, dieksporPada: new Date().toISOString(), data: data };
  unduhBerkas('absensi-siswa-' + scope + '-' + todayStr() + '.json', JSON.stringify(paket, null, 2), 'application/json');
}
/* ID yang aman untuk masuk ke atribut HTML/JS: hanya huruf, angka, '-', '_'.
   Catatan impor ber-ID di luar pola ini dilewati (berkas ekspor resmi
   aplikasi selalu memakai ID berpola ini). */
function idAman(id){ return typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id); }
function gabungData(d, scope){
  const acc = scope === 'guru' ? currentAccount() : null;
  const hasil = { kelas: 0, siswa: 0, absensi: 0, akun: 0, lewati: 0 };
  const petaKelas = {};  // id kelas di berkas -> id kelas final di perangkat
  const petaSiswa = {};  // id siswa di berkas -> id siswa final di perangkat

  if(scope === 'admin' && Array.isArray(d.accounts)){
    d.accounts.forEach(a => {
      if(!a || !idAman(a.id) || !a.email) { hasil.lewati++; return; }
      const bentrok = db.accounts.some(x => x.id === a.id) ||
        db.accounts.some(x => x.email.toLowerCase() === String(a.email).toLowerCase());
      if(bentrok){ hasil.lewati++; return; }
      db.accounts.push({ id: a.id, email: String(a.email).slice(0, 100), phone: String(a.phone || '').slice(0, 20), role: a.role === 'guru' ? 'guru' : 'siswa', createdAt: a.createdAt || new Date().toISOString() });
      hasil.akun++;
    });
  }

  (Array.isArray(d.classes) ? d.classes : []).forEach(c => {
    if(!c || !idAman(c.id) || !c.name){ hasil.lewati++; return; }
    c = Object.assign({}, c, { name: String(c.name).slice(0, 60) });
    const pemilik = scope === 'admin' ? (c.ownerTeacherId || null) : acc.id;
    const sama = getClass(c.id);
    if(sama && (scope === 'admin' || sama.ownerTeacherId === acc.id)){ petaKelas[c.id] = sama.id; hasil.lewati++; return; }
    if(sama){ // ID bentrok dengan milik pihak lain -> buat ID baru
      const baru = { id: newClassId(), name: String(c.name), ownerTeacherId: pemilik };
      db.classes.push(baru); petaKelas[c.id] = baru.id; hasil.kelas++; return;
    }
    if(scope === 'guru'){
      const exName = findClassByName(c.name, acc.id);
      if(exName){ petaKelas[c.id] = exName.id; hasil.lewati++; return; }
    }
    db.classes.push({ id: c.id, name: String(c.name), ownerTeacherId: pemilik });
    petaKelas[c.id] = c.id; hasil.kelas++;
  });

  (Array.isArray(d.students) ? d.students : []).forEach(s => {
    if(!s || !idAman(s.id) || !s.name){ hasil.lewati++; return; }
    if(getStudent(s.id)){ petaSiswa[s.id] = s.id; hasil.lewati++; return; }
    if(scope === 'guru' && !petaKelas[s.classId]){ hasil.lewati++; return; } // kelasnya bukan milik guru ini
    const salin = normStudent(Object.assign({}, s));
    salin.name = String(salin.name).slice(0, 100);
    salin.classId = petaKelas[s.classId] || (idAman(s.classId) ? s.classId : '');
    if(!idAman(salin.ownerAccountId)) delete salin.ownerAccountId;
    db.students.push(salin);
    petaSiswa[s.id] = salin.id; hasil.siswa++;
  });

  (Array.isArray(d.attendance) ? d.attendance : []).forEach(a => {
    if(!a || !a.studentId || !a.date || !a.status) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)) return;
    if(['Hadir', 'Sakit', 'Izin', 'Alpa'].indexOf(a.status) === -1) return;
    const sidFinal = petaSiswa[a.studentId];
    if(!sidFinal) return;
    if(recordOf(sidFinal, a.date)){ hasil.lewati++; return; }
    db.attendance.push({ studentId: sidFinal, date: a.date, status: a.status, note: String(a.note || '').slice(0, 200), time: String(a.time || '').slice(0, 8) });
    hasil.absensi++;
  });
  return hasil;
}
function imporData(input, scope){
  const f = input.files && input.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const paket = JSON.parse(String(reader.result || ''));
      if(!paket || paket.app !== 'absensi-siswa' || !paket.data) throw new Error('format tidak dikenal');
      const h = gabungData(paket.data, scope);
      if(!saveDBStrict()){
        alert('❌ ' + PESAN_KUOTA);
      } else {
        alert('✅ Impor selesai. Ditambahkan: ' + h.kelas + ' kelas, ' + h.siswa + ' siswa, ' + h.absensi + ' catatan absensi' +
          (scope === 'admin' ? ', ' + h.akun + ' akun' : '') + '. Dilewati karena sudah ada: ' + h.lewati + ' catatan.');
      }
    }catch(e){
      alert('❌ Berkas tidak dapat diimpor. Pastikan berkas adalah hasil "Ekspor Data (JSON)" dari aplikasi Absensi Siswa.');
    }
    input.value = '';
    render();
  };
  reader.onerror = function(){ alert('❌ Berkas tidak dapat dibaca.'); input.value = ''; };
  reader.readAsText(f);
}

      : 'Ekspor data <b>milik Anda</b> (kelas, siswa beserta identitas &amp; dokumennya, dan absensi di kelas Anda) menjadi satu berkas JSON. Impor membaca berkas hasil ekspor lalu <b>menggabungkan</b> isinya ke data Anda — catatan yang sudah ada dilewati, tidak ditimpa.') +
    '<br>Versi mandiri ini menyimpan data hanya di perangkat ini, jadi <b>berkas ekspor inilah cadangannya</b> — simpan di tempat yang aman.</p>' +

/* ============================== REKAP CSV ============================== */
function hitungBulan(studentId, ym){
  const c = { Hadir: 0, Sakit: 0, Izin: 0, Alpa: 0 };
  db.attendance.forEach(a => {
    if(a.studentId === studentId && a.date.indexOf(ym) === 0 && c[a.status] != null) c[a.status]++;
  });
  return c;
}
function csvCell(v){
  v = String(v == null ? '' : v);
  return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function unduhRekapCSV(scope){
  let list, ym;
  if(scope === 'admin'){
    ym = adminRekapMonth;
    list = db.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'id'));
  } else {
    const acc = currentAccount();
    ym = rekapMonth;
    const mine = guruStudents(acc);
    list = (rekapClass ? mine.filter(s => s.classId === rekapClass) : mine)
      .slice().sort((a, b) => a.name.localeCompare(b.name, 'id'));
  }
  if(list.length === 0){ alert('Tidak ada siswa untuk diekspor pada pilihan ini.'); return; }
  const baris = [['Nama', 'NISN', 'Kelas', 'Hadir', 'Sakit', 'Izin', 'Alpa', '% Hadir']];
  list.forEach(s => {
    const c = hitungBulan(s.id, ym);
    const t = c.Hadir + c.Sakit + c.Izin + c.Alpa;
    baris.push([s.name, s.nis || '', className(s.classId), c.Hadir, c.Sakit, c.Izin, c.Alpa, t ? Math.round(c.Hadir / t * 100) + '%' : '-']);
  });
  const csv = '\ufeff' + baris.map(r => r.map(csvCell).join(';')).join('\r\n');
  unduhBerkas('rekap-absensi-' + ym + '.csv', csv, 'text/csv;charset=utf-8');
}

const AKUN_KEY = 'absensiSiswa.akun';

try{ sessionAccountId = localStorage.getItem(AKUN_KEY) || null; }catch(e){}

function normPhone(p){ return String(p || '').replace(/\D/g, ''); }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || '').trim()); }

/* ============================== ANTI-DUPLIKAT ==============================
   Aturan pemilik aplikasi (versi final): sebuah catatan hanya ditolak bila
   SELURUH data identitasnya persis sama dengan siswa yang sudah ada — nama,
   NISN, nama ayah, nama ibu, anak ke berapa, alamat, NIK, email, nomor HP,
   tempat lahir, tanggal lahir, jenis kelamin, dan kelas semuanya sama.
   Bila hanya SEBAGIAN yang sama (misalnya nama sama, atau NISN sama saja),
   data DITERIMA. Pemeriksaan ini tidak pernah memblokir berdasarkan satu
   kolom saja. Dipakai di pendaftaran siswa, Edit Identitas, tambah/edit
   siswa oleh guru, tambah banyak, impor QR, dan ubahan oleh admin. */
function kunciIdentitas(o){
  const t = v => String(v == null ? '' : v).trim().toLowerCase();
  return [
    t(o.name), t(o.nis),
    t(o.ayah), t(o.ibu), t(o.anakKe), t(o.alamat), t(o.nik),
    t(o.email), String(o.hp || '').replace(/\D/g, ''),
    t(o.tempatLahir), t(o.tglLahir),
    t(o.gender), String(o.classId || '')
  ].join('|');
}
function findDuplicate(cand, excludeId){
  const kunci = kunciIdentitas(cand);
  return db.students.find(s => {
    if(excludeId && s.id === excludeId) return false;
    return kunciIdentitas(s) === kunci;
  }) || null;
}
/* ============================== VALIDASI MASUKAN ==============================
   Semua formulir divalidasi sebelum disimpan: batas panjang teks dan pola
   angka untuk NISN/NIK/nomor HP, format email, dan tanggal lahir yang wajar.
   Mengembalikan pesan kesalahan Bahasa Indonesia, atau null bila lolos. */
function validasiIdentitas(v){
  const digit = s => /^[0-9]+$/.test(s);
  if(v.nama.length > 100) return 'Nama lengkap terlalu panjang (maks. 100 karakter).';
  if(v.nis && !digit(v.nis)) return 'NISN hanya boleh berisi angka.';
  if(v.nis.length > 30) return 'NISN terlalu panjang (maks. 30 angka).';
  if(v.nik && !digit(v.nik)) return 'NIK hanya boleh berisi angka.';
  if(v.nik && v.nik.length !== 16) return 'NIK harus tepat 16 angka (sesuai KTP/KK). Isi 16 angka atau kosongkan bila belum ada.';
  if(v.hp && !/^[0-9]{9,15}$/.test(v.hp.replace(/[\s+\-()]/g, ''))) return 'Nomor HP harus berupa 9–15 angka.';
  if(v.email && !validEmail(v.email)) return 'Format email pada identitas belum benar.';
  if(v.ayah.length > 100 || v.ibu.length > 100) return 'Nama ayah/ibu terlalu panjang (maks. 100 karakter).';
  if(v.tempatLahir.length > 60) return 'Tempat lahir terlalu panjang (maks. 60 karakter).';
  if(v.alamat.length > 300) return 'Alamat terlalu panjang (maks. 300 karakter).';
  if(v.anakKe && (!digit(v.anakKe) || +v.anakKe < 1 || +v.anakKe > 30)) return 'Kolom "Anak ke Berapa" harus berupa angka antara 1 dan 30.';
  if(v.kelasLain && v.kelasLain.length > 60) return 'Nama kelas terlalu panjang (maks. 60 karakter).';
  if(v.tglLahir){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v.tglLahir)) return 'Tanggal lahir tidak valid.';
    if(v.tglLahir > todayStr()) return 'Tanggal lahir tidak boleh berada di masa depan.';
  }
  return null;
}
/* Validasi ringkas untuk formulir guru (nama + NISN) dan nama kelas. */
function validasiNamaNis(nama, nis){
  if(nama.length > 100) return 'Nama siswa terlalu panjang (maks. 100 karakter).';
  if(nis && !/^[0-9]+$/.test(nis)) return 'NISN hanya boleh berisi angka.';
  if(nis.length > 30) return 'NISN terlalu panjang (maks. 30 angka).';
  return null;
}

/* Mengembalikan pesan penolakan (Bahasa Indonesia) bila duplikat, atau null. */
function cekDuplikat(cand, excludeId){
  const dup = findDuplicate(cand, excludeId);
  if(!dup) return null;
  return 'Data ditolak karena duplikat persis: SELURUH identitas ini (nama, NISN, data orang tua, NIK, kontak, tempat/tanggal lahir, jenis kelamin, dan kelas) sama persis dengan siswa yang sudah terdaftar (' +
    dup.name + ', NISN ' + (dup.nis || '-') + ', ' + className(dup.classId) + '). ' +
    'Penolakan hanya terjadi bila semua data identitas sama persis — bila ada satu saja yang berbeda, data dapat disimpan.';
}

function submitDaftarAkun(ev){
  ev.preventDefault();
  const email = document.getElementById('r-email').value.trim();
  const phone = document.getElementById('r-hp').value.trim();
  regAkunKeep = { email: email, phone: phone };
  if(!validEmail(email)){
    akunMsg = { type:'err', text:'Format email belum benar. Periksa kembali email Anda.' };
    render(); return false;
  }
  if(normPhone(phone).length < 9){
    akunMsg = { type:'err', text:'Nomor HP terlalu pendek. Isi nomor HP yang benar.' };
    render(); return false;
  }
  if(db.accounts.some(a => a.email.toLowerCase() === email.toLowerCase())){
    akunMsg = { type:'err', text:'Email ini sudah terdaftar di perangkat ini. Silakan masuk dengan email dan nomor HP Anda.' };
    render(); return false;
  }
  const acc = { id: newAccountId(), email: email, phone: phone, role: 'siswa', createdAt: new Date().toISOString() };
  db.accounts.push(acc);
  regAkunKeep = null;
  saveDB();
  setSession(acc);
  akunMsg = { type:'ok', text:'✅ Akun siswa dibuat dan Anda sudah masuk. Sekarang daftarkan data siswa Anda.' };
  render();
  return false;
}
function submitMasuk(ev){
  ev.preventDefault();
  const email = document.getElementById('m-email').value.trim().toLowerCase();
  const phone = normPhone(document.getElementById('m-hp').value);
  const cocok = db.accounts.find(a => a.email.toLowerCase() === email && normPhone(a.phone) === phone);
  if(!cocok){
    akunMsg = { type:'err', text:'Akun tidak ditemukan di perangkat ini. Periksa email dan nomor HP Anda, atau daftar akun baru di bawah.' };
    render(); return false;
  }
  if(cocok.role !== 'siswa'){
    akunMsg = { type:'err', text:'Email ini terdaftar sebagai akun Guru. Portal Siswa memerlukan akun Siswa — silakan daftar akun siswa atau masuk lewat mode Guru.' };
    render(); return false;
  }
  setSession(cocok);
  akunMsg = null;
  render();
  return false;
}

  const email = document.getElementById('gr-email').value.trim();
  const phone = document.getElementById('gr-hp').value.trim();
  regGuruKeep = { email: email, phone: phone };
  if(!validEmail(email)){
    guruMsg = { type:'err', text:'Format email belum benar. Periksa kembali email Anda.' };
    render(); return false;
  }
  if(normPhone(phone).length < 9){
    guruMsg = { type:'err', text:'Nomor HP terlalu pendek. Isi nomor HP yang benar.' };
    render(); return false;
  }
  if(db.accounts.some(a => a.email.toLowerCase() === email.toLowerCase())){
    guruMsg = { type:'err', text:'Email ini sudah terdaftar di perangkat ini. Silakan masuk dengan email dan nomor HP Anda.' };
    render(); return false;
  }
  const acc = { id: newAccountId(), email: email, phone: phone, role: 'guru', createdAt: new Date().toISOString() };
  db.accounts.push(acc);
  regGuruKeep = null;
  saveDB();
  setSession(acc);
  guruMsg = null;
  akunMsg = null;
  render();
  return false;
}
function submitMasukGuru(ev){
  ev.preventDefault();
  const email = document.getElementById('gm-email').value.trim().toLowerCase();
  const phone = normPhone(document.getElementById('gm-hp').value);
  const cocok = db.accounts.find(a => a.email.toLowerCase() === email && normPhone(a.phone) === phone);
  if(!cocok){
    guruMsg = { type:'err', text:'Akun tidak ditemukan di perangkat ini. Periksa email dan nomor HP Anda, atau daftar akun guru baru di bawah.' };
    render(); return false;
  }
  if(cocok.role !== 'guru'){
    guruMsg = { type:'err', text:'Email ini terdaftar sebagai akun Siswa. Mode Guru memerlukan akun Guru — silakan daftar akun guru atau masuk lewat mode Siswa.' };
    render(); return false;
  }
  setSession(cocok);
  guruMsg = null;
  render();
  return false;
}

/* ============================== DOKUMEN & IDENTITAS ==============================
   Foto dokumen (KK, KTP ayah, KTP ibu) diperkecil dulu di peramban
   (maks. 1000 piksel sisi terpanjang, JPEG kualitas 0,8) lalu disimpan
   sebagai data URL di localStorage. Draf per formulir: dokDaftar (pendaftaran),
   dokUbah (Edit Identitas), dokAdmin (ubahan oleh admin). */
let dokAdmin = null;
function dokKosong(){ return { kk: '', ktpAyah: '', ktpIbu: '' }; }
function drafDok(cakupan){
  return cakupan === 'daftar' ? dokDaftar : (cakupan === 'ubah' ? dokUbah : dokAdmin);
}
function kompresiFoto(file, selesai){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    const maks = 1000;
    let w = img.naturalWidth || 1, h = img.naturalHeight || 1;
    const skala = Math.min(1, maks / Math.max(w, h));
    w = Math.max(1, Math.round(w * skala)); h = Math.max(1, Math.round(h * skala));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    selesai(cv.toDataURL('image/jpeg', 0.8));
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    alert('Berkas gambar tidak dapat dibaca. Gunakan foto JPG/PNG yang wajar.');
  };
  img.src = url;
}
/* Periksa tipe berkas dari MAGIC BYTES isinya (bukan dari nama/ekstensi):
   JPEG, PNG, GIF, WebP, atau BMP. */
function cekMagicGambar(b){
  if(b.length >= 3 && b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return true;
  if(b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47 &&
     b[4] === 0x0D && b[5] === 0x0A && b[6] === 0x1A && b[7] === 0x0A) return true;
  if(b.length >= 4 && b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) return true;
  if(b.length >= 12 && b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
     b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return true;
  if(b.length >= 2 && b[0] === 0x42 && b[1] === 0x4D) return true;
  return false;
}
const MAKS_UKURAN_FOTO = 10 * 1024 * 1024; // 10 MB sebelum kompresi
function unggahDok(input, cakupan, kunci){
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.size > MAKS_UKURAN_FOTO){
    alert('Berkas ditolak: ukuran foto terlalu besar (maks. 10 MB sebelum diperkecil). Pilih foto yang lebih kecil.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    const b = new Uint8Array(reader.result || new ArrayBuffer(0));
    if(!cekMagicGambar(b)){
      alert('Berkas ditolak: isinya bukan gambar yang valid. Pilih berkas foto JPG, PNG, WebP, GIF, atau BMP yang benar.');
      input.value = '';
      return;
    }
    // Lolos magic bytes; kompresiFoto juga akan gagal-baca bila gambar rusak.
    kompresiFoto(f, function(dataUrl){
      const draf = drafDok(cakupan);
      if(draf) draf[kunci] = dataUrl;
      const pv = document.getElementById(cakupan + '-prev-' + kunci);
      if(pv){ pv.src = dataUrl; pv.style.display = ''; }
      const tdk = document.getElementById(cakupan + '-none-' + kunci);
      if(tdk) tdk.style.display = 'none';
      const nm = document.getElementById(cakupan + '-nama-' + kunci);
      if(nm) nm.textContent = 'Foto terpilih dan terkompresi — tersimpan saat formulir disimpan.';
    });
  };
  reader.onerror = function(){
    alert('Berkas tidak dapat dibaca. Coba berkas lain.');
    input.value = '';
  };
  reader.readAsArrayBuffer(f.slice(0, 16));
}
function hapusDok(cakupan, kunci){
  const draf = drafDok(cakupan);
  if(draf) draf[kunci] = '';
  const pv = document.getElementById(cakupan + '-prev-' + kunci);
  if(pv){ pv.removeAttribute('src'); pv.style.display = 'none'; }
  const tdk = document.getElementById(cakupan + '-none-' + kunci);
  if(tdk) tdk.style.display = '';
  const inp = document.getElementById(cakupan + '-dok-' + kunci);
  if(inp) inp.value = '';
  const nm = document.getElementById(cakupan + '-nama-' + kunci);
  if(nm) nm.textContent = '';
}
/* Hanya data URL gambar hasil kompresi aplikasi yang boleh menjadi src foto.
   Nilai lain (misalnya dari berkas impor yang dibuat pihak lain) dibuang,
   agar tidak ada suntikan atribut/markah lewat kolom dokumen. */
function dokSrcAman(v){
  return (typeof v === 'string' && v.indexOf('data:image/') === 0) ? v : '';
}
function dokFieldsHtml(cakupan, draf){
  return '<div class="form-sub">Dokumen (Foto)</div>' +
    '<p class="small muted" style="margin-top:0">Unggah foto dokumen berikut. Foto otomatis diperkecil (maks. 1000 piksel, JPEG) sebelum disimpan di perangkat ini agar penyimpanan tidak cepat penuh.</p>' +
    '<div class="doc-grid">' + DOK_KEYS.map(k => {
      const ada = draf && dokSrcAman(draf[k]);
      return '<div class="doc-box"><div class="doc-lbl">' + DOK_LABEL[k] + '</div>' +
        '<img id="' + cakupan + '-prev-' + k + '" alt="Pratinjau ' + DOK_LABEL[k] + '"' + (ada ? ' src="' + ada + '"' : ' style="display:none"') + '>' +
        '<div class="doc-none" id="' + cakupan + '-none-' + k + '"' + (ada ? ' style="display:none"' : '') + '>Belum ada foto</div>' +
        '<input type="file" id="' + cakupan + '-dok-' + k + '" class="inp" accept="image/*" onchange="unggahDok(this, \'' + cakupan + '\', \'' + k + '\')">' +
        '<div class="small muted" id="' + cakupan + '-nama-' + k + '"></div>' +
        (ada ? '<button type="button" class="btn danger small-btn" style="margin-top:6px" onclick="hapusDok(\'' + cakupan + '\', \'' + k + '\')">Hapus Foto</button>' : '') +
      '</div>';
    }).join('') + '</div>';
}
